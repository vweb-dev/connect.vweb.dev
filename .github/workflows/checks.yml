name: Connect code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl
          coverage: none
      - name: Runner diagnostic
        run: |
          echo "Runner active: $(uname -s)"
          node --version
          php --version
          test -f index.html
      - name: PHP syntax checks
        run: |
          find api admin ops docs -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: JavaScript syntax checks
        run: node --check assets/connect-release-v80.js && node --check assets/connect-ui-polish-v74.js && node --check assets/conversion-suite-v72.js && node --check assets/unified-navigation-v56.js && node --check assets/tool-pages-v59.js && node --check assets/app.js && node --check assets/mobile-app.js && node --check assets/qr-studio.js && node --check assets/lms.js && node --check assets/converter.js && node --check assets/hub.js && node --check assets/puter-ai.js && node --check assets/entertainment.js && node --check sw.js && node --test tests/release-v80.test.mjs tests/entertainment.test.mjs tests/converter.test.mjs tests/connect20.test.mjs tests/quality.test.mjs tests/software.test.mjs tests/focus.test.mjs tests/tools-visibility.test.mjs tests/experience.test.mjs tests/mobile-app.test.mjs tests/qr-studio.test.mjs tests/lms.test.mjs tests/ios-install.test.mjs
      - name: Validate manifest and Composer metadata
        run: |
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool composer.json >/dev/null
      - name: Verify deployment files
        run: |
          test -f index.html && test -f .htaccess && test -f sw.js
          test -f admin/index.php && test -f admin/operations.php
          test -f api/public.php && test -f api/member.php && test -f api/member-tickets.php
          test -f db/schema.sql && test -f db/community.sql
