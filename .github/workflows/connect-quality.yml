name: Connect Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/connect-quality.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/connect-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regression:
    name: Source, routes and PWA contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Connect
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Connect contract tests
        run: node --test tests/navigation-contract.test.mjs
      - name: Check JavaScript source syntax
        run: |
          for file in \
            assets/app.js \
            assets/mobile-app.js \
            assets/tool-pages-v59.js \
            assets/connect-integrity-v133.js \
            assets/connect-ui-v137.js \
            assets/connect-connection-v139.js \
            sw.js
          do
            node --check "$file"
          done

# Browser smoke checks are planned separately from the source gate.

  browser-smoke:
    name: Chromium desktop and mobile smoke
    runs-on: ubuntu-latest
    needs: source-regression
    timeout-minutes: 15
    steps:
      - name: Check out Connect
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve committed portal files locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/connect-browser-server.log 2>&1 &
          echo $! >/tmp/connect-browser-server.pid
      - name: Exercise real browser navigation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173/';
          let count=0;
          async function smoke(name,width,height,fn){
            const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
            const page=await context.newPage();
            const uncaught=[];
            page.on('pageerror',err=>{uncaught.push(err.message);console.error('BROWSER ERROR:',err.message);});
            page.setDefaultTimeout(12000);
            try{
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await fn(page);
              assert.deepEqual(uncaught,[],'Unexpected browser JavaScript errors during '+name);
              count++;
              console.log('PASS '+name);
            }finally{await context.close();}
          }
          try{
            await smoke('desktop tools and QR',1366,900,async page=>{
              await page.locator('a[data-nav="tools"]').first().click();
              assert.equal(new URL(page.url()).pathname,'/tools','tools click did not navigate');
              assert.equal(await page.locator('#page-tools').isVisible(),true);
              await page.locator('a[data-nav="qr"]').first().click();
              assert.equal(new URL(page.url()).pathname,'/qr');
              assert.equal(await page.locator('#page-qr').isVisible(),true);
              assert.equal(await page.locator('#qr-design').isVisible(),true);
            });
            await smoke('desktop LMS catalog',1366,900,async page=>{
              await page.locator('a[data-nav="academy"]').first().click();
              assert.equal(new URL(page.url()).pathname,'/academy');
              await page.locator('[data-lms-view="catalog"]').first().click();
              assert.equal(await page.locator('#lms-view-catalog').isVisible(),true);
            });
            await smoke('mobile app navigation',390,844,async page=>{
              assert.equal(await page.locator('#mobile-app-topbar').isVisible(),true);
              await page.locator('.mobile-app-tabs a[data-mobile-tab="academy"]').first().click();
              await page.waitForURL('**/academy');
              assert.equal(await page.locator('#page-academy').isVisible(),true);
              await page.locator('#mobile-app-back').click();
              await page.waitForURL(base);
              assert.equal(await page.locator('#page-home').isVisible(),true);
            });
            await smoke('Convert Studio processes local image',1366,900,async page=>{
              await page.locator('a[data-nav="convert"]').first().click();
              assert.equal(new URL(page.url()).pathname,'/convert');
              const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRZkAAAAASUVORK5CYII=','base64');
              await page.locator('#convert-image-input').setInputFiles({name:'smoke.png',mimeType:'image/png',buffer:png});
              await page.locator('#convert-image-format').selectOption('image/png');
              await page.locator('#convert-image-run').click();
              await page.locator('#convert-image-status[data-state="success"]').waitFor({timeout:12000});
              const result=page.locator('#convert-image-results a[download]');
              assert.ok(await result.count()>0,'Converted image missing download link');
            });
            await smoke('QR content switching and validation',1366,900,async page=>{
              await page.locator('a[data-nav="qr"]').first().click();
              await page.locator('[data-qr-type="text"]').first().click();
              assert.equal(await page.locator('[data-qr-pane="text"]').isVisible(),true);
              const input=page.locator('[data-qr-pane="text"] textarea').first();
              await input.fill('Connect browser QA');
              await page.locator('#qr-byte-count').waitFor();
              assert.match(await page.locator('#qr-byte-count').innerText(),/[1-9][0-9]* \/ 850/);
            });
            await smoke('LMS enrollment persists after reload',1366,900,async page=>{
              await page.locator('a[data-nav="academy"]').first().click();
              const courseId=await page.evaluate(()=>{
                const api=window.ConnectLMS;
                if(!api?.snapshot||!api?.enroll)throw Error('LMS storage bridge unavailable');
                const id=api.snapshot().courses[0]?.id;
                if(!id)throw Error('Course catalog is empty');
                api.enroll(id);
                return id;
              });
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>Boolean(window.ConnectLMS?.snapshot()?.courses?.length));
              const persists=await page.evaluate(id=>window.ConnectLMS.snapshot().enrolled.includes(id),courseId);
              assert.ok(persists,'LMS enrollment was lost on browser reload');
            });
            await smoke('LMS lesson completion persists',1366,900,async page=>{
              await page.locator('a[data-nav="academy"]').first().click();
              const courseId=await page.evaluate(()=>{
                const api=window.ConnectLMS;
                const id=api?.snapshot()?.courses?.[0]?.id;
                if(!id)throw Error('Course not available');
                api.open(id,0);
                return id;
              });
              await page.locator('#hub-lesson-complete').click();
              const before=await page.evaluate(id=>window.ConnectLMS.snapshot().completed[id]||[],courseId);
              assert.ok(before.includes(0),'Lesson was not marked complete');
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>Boolean(window.ConnectLMS?.snapshot()?.courses?.length));
              const after=await page.evaluate(id=>window.ConnectLMS.snapshot().completed[id]||[],courseId);
              assert.ok(after.includes(0),'Completed lesson was lost on reload');
            });
            await smoke('QR SVG and PNG downloads',1366,900,async page=>{
              await page.locator('a[data-nav="qr"]').first().click();
              await page.locator('#qr-url').fill('https://vweb.dev/qa');
              await page.locator('[data-qr-export="svg"]:not([disabled])').waitFor({timeout:35000});
              for(const kind of ['svg','png']){
                let download;
                try{
                  [download]=await Promise.all([
                    page.waitForEvent('download',{timeout:12000}),
                    page.locator('[data-qr-export="'+kind+'"]').evaluate(button=>button.click())
                  ]);
                }catch(error){
                  const details=await page.evaluate(()=>({
                    status:document.getElementById('qr-status')?.textContent,
                    state:document.getElementById('qr-preview-state')?.textContent,
                    ready:[...document.querySelectorAll('.qr-export-button')].map(b=>({format:b.dataset.qrExport,disabled:b.disabled}))
                  }));
                  console.log('QR download diagnostic',JSON.stringify(details));
                  throw Error('QR '+kind+' export: '+JSON.stringify(details)+' / '+error.message);
                }
                assert.ok(download.suggestedFilename().endsWith('.'+kind),'Incorrect QR export extension');
                const filePath=await download.path();
                assert.ok(filePath,'Missing '+kind+' export');
              }
            });
            await smoke('PDF Studio rejects unsupported uploads',1366,900,async page=>{
              await page.locator('a[data-nav="convert"]').first().click();
              await page.locator('#convert-tab-pdf').click();
              await page.locator('[data-pdf-mode="merge"]').first().click();
              await page.locator('#convert-pdf-input').setInputFiles({
                name:'not-a-pdf.txt',mimeType:'text/plain',buffer:Buffer.from('This is not a PDF')
              });
              assert.equal(await page.locator('#convert-pdf-list .convert-file-row').count(),0,
                'Unsupported upload must never enter PDF file list');
            });
            await smoke('PDF Studio rejects renamed non-PDF before loading helper',1366,900,async page=>{
              await page.locator('a[data-nav="convert"]').first().click();
              await page.locator('#convert-tab-pdf').click();
              await page.locator('[data-pdf-mode="extract"]').click();
              await page.locator('#convert-pdf-input').setInputFiles({
                name:'renamed.pdf',mimeType:'application/pdf',
                buffer:Buffer.from('This file is not a valid PDF despite its name.')
              });
              assert.equal(await page.locator('#convert-pdf-list .convert-file-row').count(),1);
              await page.locator('#convert-pdf-run').click();
              await page.locator('#convert-pdf-status[data-state="error"]').waitFor();
              assert.match(await page.locator('#convert-pdf-status').innerText(),/invalid PDF file/i);
              assert.equal(await page.evaluate(()=>typeof window.PDFLib),'undefined',
                'PDF engine should not load for an invalid file');
              assert.equal(await page.locator('#convert-pdf-results a[download]').count(),0);
            });
            await smoke('PDF Studio converts photos into a downloadable PDF',1366,900,async page=>{
              await page.locator('a[data-nav="convert"]').first().click();
              await page.locator('#convert-tab-pdf').click();
              await page.locator('[data-pdf-mode="photos"]').first().click();
              const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRZkAAAAASUVORK5CYII=','base64');
              await page.locator('#convert-pdf-input').setInputFiles({name:'picture.png',mimeType:'image/png',buffer:png});
              await page.locator('#convert-pdf-run').click();
              try{
                await page.locator('#convert-pdf-status[data-state="success"]').waitFor({timeout:25000});
              }catch(error){
                const details=await page.evaluate(()=>({
                  status:document.getElementById('convert-pdf-status')?.textContent,
                  state:document.getElementById('convert-pdf-status')?.dataset.state,
                  files:[...document.querySelectorAll('#convert-pdf-list .convert-file-row')].map(x=>x.textContent),
                  helper:typeof window.PDFLib,
                  buttonDisabled:document.getElementById('convert-pdf-run')?.disabled
                }));
                throw Error('Photo to PDF: '+JSON.stringify(details)+' / '+error.message);
              }
              const pdf=page.locator('#convert-pdf-results a[download]');
              assert.ok(await pdf.count()>0,'Photo-to-PDF result missing');
              assert.ok((await pdf.first().getAttribute('download')).endsWith('.pdf'));
              const result=await page.evaluate(async()=>{
                const url=document.querySelector('#convert-pdf-results a[download]').href;
                const buffer=await (await fetch(url)).arrayBuffer();
                return {header:String.fromCharCode(...new Uint8Array(buffer).slice(0,5)),bytes:buffer.byteLength};
              });
              assert.equal(result.header,'%PDF-','Result is not a PDF');
              assert.ok(result.bytes>100,'Output PDF is empty');
              const pdfBytes=await page.evaluate(async()=>{
                const link=document.querySelector('#convert-pdf-results a[download]');
                return [...new Uint8Array(await (await fetch(link.href)).arrayBuffer())];
              });
              await page.locator('[data-pdf-mode="merge"]').click();
              await page.locator('#convert-pdf-input').setInputFiles([
                {name:'first.pdf',mimeType:'application/pdf',buffer:Buffer.from(pdfBytes)},
                {name:'second.pdf',mimeType:'application/pdf',buffer:Buffer.from(pdfBytes)}
              ]);
              await page.locator('#convert-pdf-run').click();
              await page.locator('#convert-pdf-status[data-state="success"]').waitFor({timeout:25000});
              const merged=await page.evaluate(async()=>{
                const link=document.querySelector('#convert-pdf-results a[download]');
                if(!link)return null;
                const bytes=await (await fetch(link.href)).arrayBuffer();
                const doc=await window.PDFLib.PDFDocument.load(bytes);
                return {filename:link.getAttribute('download'),pages:doc.getPageCount()};
              });
              assert.equal(merged?.pages,2,'Merged PDF should contain exactly two pages');
              assert.ok(merged.filename.endsWith('.pdf'));
              const mergedBytes=await page.evaluate(async()=>{
                const link=document.querySelector('#convert-pdf-results a[download]');
                return [...new Uint8Array(await (await fetch(link.href)).arrayBuffer())];
              });
              await page.locator('[data-pdf-mode="extract"]').click();
              assert.equal(await page.locator('[data-pdf-mode="extract"]').getAttribute('aria-pressed'),'true');
              assert.equal(await page.locator('[data-pdf-mode="merge"]').getAttribute('aria-pressed'),'false');
              await page.locator('#convert-pdf-input').setInputFiles({
                name:'merged.pdf',mimeType:'application/pdf',buffer:Buffer.from(mergedBytes)
              });
              await page.locator('#convert-pdf-range').fill('2');
              await page.locator('#convert-pdf-run').click();
              await page.locator('#convert-pdf-status[data-state="success"]').waitFor({timeout:25000});
              const extracted=await page.evaluate(async()=>{
                const link=document.querySelector('#convert-pdf-results a[download]');
                const bytes=await (await fetch(link.href)).arrayBuffer();
                return (await window.PDFLib.PDFDocument.load(bytes)).getPageCount();
              });
              assert.equal(extracted,1,'Extract page 2 should create exactly one page');
              await page.locator('[data-pdf-mode="split"]').click();
              await page.locator('#convert-pdf-input').setInputFiles({
                name:'merged.pdf',mimeType:'application/pdf',buffer:Buffer.from(mergedBytes)
              });
              await page.locator('#convert-pdf-run').click();
              await page.locator('#convert-pdf-status[data-state="success"]').waitFor({timeout:25000});
              const archive=await page.evaluate(async()=>{
                const link=document.querySelector('#convert-pdf-results a[download]');
                const bytes=new Uint8Array(await (await fetch(link.href)).arrayBuffer());
                return {filename:link.getAttribute('download'),magic:[...bytes.slice(0,4)]};
              });
              assert.ok(archive.filename.endsWith('.zip'));
              assert.deepEqual(archive.magic,[80,75,3,4],'Split output must be a valid ZIP header');
            });
            console.log('PASS '+count+' browser interaction scenarios');
          }finally{await browser.close();}
          NODE
